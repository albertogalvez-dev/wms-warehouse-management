# Development profile configuration
# Used when SPRING_PROFILES_ACTIVE=dev

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5433}/${DB_NAME:wms}
    username: ${DB_USER:wms}
    password: ${DB_PASS:wms}

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

# Development CORS - Allow all origins
cors:
  allowed-origins: "*"

# Swagger enabled
springdoc:
  swagger-ui:
    enabled: true

# JWT - shorter expiration for dev testing
jwt:
  secret: ${JWT_SECRET:dev-secret-key-not-for-production}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

# Actuator - more exposure in dev
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env
