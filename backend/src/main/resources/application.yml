server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: wms-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5433}/${DB_NAME:wms}
    username: ${DB_USER:wms}
    password: ${DB_PASS:wms}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

# OpenAPI / Swagger
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# Zebra Printer (TCP port 9100)
printer:
  enabled: ${PRINTER_ENABLED:false}
  host: ${PRINTER_HOST:}
  port: ${PRINTER_PORT:9100}
  fail-strict: ${PRINTER_FAIL_STRICT:false}
  timeout: ${PRINTER_TIMEOUT:5000}

# JWT Security
jwt:
  secret: ${JWT_SECRET:dev-secret-key-for-local-development-only-change-in-prod}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

