# ============================================
# WMS Production Docker Compose
# For deployment to Oracle VPS (ARM64/aarch64)
# ============================================
# Usage:
#   cp .env.example .env
#   # Edit .env with production values
#   docker compose -f docker-compose.prod.yml up -d --build
# ============================================

version: "3.9"

services:
  # ================================================
  # PostgreSQL Database
  # ================================================
  db:
    image: postgres:16-alpine
    container_name: wms-db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-wms}
      POSTGRES_USER: ${DB_USER:-wms_user}
      POSTGRES_PASSWORD: ${DB_PASS:?DB_PASS is required}
    volumes:
      - wms-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER:-wms_user} -d ${DB_NAME:-wms}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - wms-network
    # No external ports exposed in production for security

    # ================================================
    # Spring Boot Backend (API)
    # ================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wms-backend
    restart: always
    environment:
      # Spring profile
      SPRING_PROFILES_ACTIVE: prod
      # Database connection (Spring Boot standard names)
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME:-wms}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-wms_user}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASS:?DB_PASS is required}
      # Legacy env vars for backward compatibility
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-wms}
      DB_USER: ${DB_USER:-wms_user}
      DB_PASS: ${DB_PASS:?DB_PASS is required}
      # JWT Security
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      # Server
      SERVER_PORT: 8080
      # Printer (optional)
      PRINTER_ENABLED: ${PRINTER_ENABLED:-false}
      PRINTER_HOST: ${PRINTER_HOST:-}
      PRINTER_PORT: ${PRINTER_PORT:-9100}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - wms-network

  # ================================================
  # Caddy (Reverse Proxy + Auto HTTPS)
  # ================================================
  proxy:
    image: caddy:2-alpine
    container_name: wms-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend:/srv/frontend:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - wms-network

volumes:
  wms-postgres-data:
    driver: local
  caddy-data:
    driver: local
  caddy-config:
    driver: local

networks:
  wms-network:
    driver: bridge
