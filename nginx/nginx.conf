worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    server {
        listen 80;
        server_name _;

        # Root for static files (Landing page as default)
        root /usr/share/nginx/html;
        index index.html;

        # =============================================
        # STATIC FILES
        # =============================================

        # Landing page (root) - Portfolio demo page
        location = / {
            try_files /landing/index.html =404;
        }

        # Landing page assets
        location /landing {
            alias /usr/share/nginx/html/landing;
            try_files $uri $uri/ /landing/index.html;
        }

        # Backoffice app
        location /backoffice {
            alias /usr/share/nginx/html/backoffice;
            try_files $uri $uri/ /backoffice/index.html;
        }

        # Handheld app
        location /handheld {
            alias /usr/share/nginx/html/handheld;
            try_files $uri $uri/ /handheld/index.html;
        }

        # Shared theme/js
        location /shared {
            alias /usr/share/nginx/html/shared;
        }

        # =============================================
        # API REVERSE PROXY (Backend)
        # =============================================

        location /api/ {
            proxy_pass http://backend:8080/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 30s;
            proxy_read_timeout 60s;
        }

        # Auth endpoints (for JWT)
        location /auth/ {
            proxy_pass http://backend:8080/auth/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Swagger UI
        location /swagger-ui/ {
            proxy_pass http://backend:8080/swagger-ui/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # OpenAPI docs
        location /v3/api-docs {
            proxy_pass http://backend:8080/v3/api-docs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Actuator (health checks)
        location /actuator/ {
            proxy_pass http://backend:8080/actuator/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Error pages
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
