# Production profile configuration
# Used when SPRING_PROFILES_ACTIVE=prod

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true

# Production CORS - Restrict to specific origins
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

# Swagger disabled in production
springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

# JWT - production secret (must be set via env var)
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

# Actuator - minimal exposure in prod
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
