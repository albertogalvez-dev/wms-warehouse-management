<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>WMS Handheld - Login</title>
    <link rel="stylesheet" href="../shared/theme.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--color-dark);
        }

        .login-header {
            background: var(--color-primary);
            color: white;
            padding: 1.5rem;
            text-align: center;
        }

        .login-brand {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
        }

        .login-logo-img {
            width: 48px;
            height: 48px;
            border-radius: 10px;
        }

        .login-header h1 {
            font-size: 1.5rem;
            margin: 0;
        }

        .login-header p {
            opacity: 0.8;
            margin: 0.25rem 0 0;
            font-size: 0.875rem;
        }

        .login-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 2rem;
            max-width: 400px;
            margin: 0 auto;
            width: 100%;
        }

        .login-card {
            background: white;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
            font-size: 1rem;
        }

        .form-group input {
            width: 100%;
            padding: 1rem;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 1.125rem;
            transition: all 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--color-primary);
            box-shadow: 0 0 0 4px rgba(0, 64, 144, 0.15);
        }

        .btn-login {
            width: 100%;
            padding: 1.25rem;
            background: var(--color-accent);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.25rem;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.2s;
        }

        .btn-login:hover {
            background: var(--color-accent-dark);
        }

        .btn-login:active {
            transform: scale(0.98);
        }

        .btn-login:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .error-message {
            background: #fee2e2;
            color: #dc2626;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 1rem;
            font-weight: 600;
            text-align: center;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .login-footer {
            text-align: center;
            padding: 1.5rem;
        }

        .login-footer a {
            color: white;
            text-decoration: none;
            opacity: 0.7;
            font-size: 0.875rem;
        }

        .login-footer a:hover {
            opacity: 1;
        }
    </style>
</head>

<body>
    <header class="login-header">
        <div class="login-brand">
            <img src="../assets/logo.png" alt="WMS Logo" class="login-logo-img">
            <div>
                <h1>WMS Handheld</h1>
                <p>Packing Terminal</p>
            </div>
        </div>
    </header>

    <main class="login-main">
        <div class="login-card">
            <div id="errorMessage" class="error-message"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required autocomplete="username"
                        placeholder="Enter username" autocapitalize="off" autocorrect="off">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password"
                        placeholder="Enter password">
                </div>

                <button type="submit" class="btn-login" id="loginBtn">
                    Sign In
                </button>
            </form>
        </div>
    </main>

    <footer class="login-footer">
        <a href="../">Back to Home</a>
    </footer>

    <script type="module">
        import { login, isAuthenticated } from '../shared/auth.js';
        import { getApiBaseUrl } from './config.js';

        if (isAuthenticated()) {
            window.location.href = './index.html';
        }

        const form = document.getElementById('loginForm');
        const errorDiv = document.getElementById('errorMessage');
        const loginBtn = document.getElementById('loginBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (!username || !password) {
                showError('Enter username and password');
                return;
            }

            loginBtn.disabled = true;
            loginBtn.textContent = 'Signing in...';
            errorDiv.classList.remove('show');

            try {
                const apiUrl = getApiBaseUrl();
                await login(apiUrl, username, password);
                window.location.href = './index.html';
            } catch (err) {
                showError(err.message || 'Login failed');
                loginBtn.disabled = false;
                loginBtn.textContent = 'Sign In';
            }
        });

        function showError(message) {
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
        }
    </script>
</body>

</html>
