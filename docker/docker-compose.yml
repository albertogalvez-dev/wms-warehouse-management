version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: wms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: wms
      POSTGRES_USER: wms
      POSTGRES_PASSWORD: wms
    ports:
      - "5433:5432"
    volumes:
      - wms-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U wms -d wms" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  wms-postgres-data:
    driver: local
