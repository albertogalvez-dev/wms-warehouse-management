<div class="page-header">
    <h2 class="section-title">User Management</h2>
    <p class="text-muted">Create and manage system users</p>
</div>

<div class="grid grid-2">
    <!-- Create User Form -->
    <div class="card">
        <div class="card-header">
            <h3 class="card-title">Create New User</h3>
        </div>
        <div class="card-body">
            <form id="createUserForm">
                <div class="form-group">
                    <label class="label" for="newUsername">Username</label>
                    <input class="input" type="text" id="newUsername" name="username" required placeholder="Enter username"
                        autocomplete="off">
                </div>
                <div class="form-group">
                    <label class="label" for="newPassword">Password</label>
                    <input class="input" type="password" id="newPassword" name="password" required placeholder="Enter password"
                        minlength="6">
                </div>
                <div class="form-group">
                    <label class="label" for="newRole">Role</label>
                    <select class="select" id="newRole" name="role" required>
                        <option value="PICKER">OPERATOR - Picking (Handheld)</option>
                        <option value="PACKER">OPERATOR - Packing Station</option>
                        <option value="MANAGER">MANAGER - Operations Lead</option>
                        <option value="ADMIN">ADMIN - Full System Access</option>
                    </select>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <path d="M16 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2" />
                            <circle cx="8.5" cy="7" r="4" />
                            <line x1="20" y1="8" x2="20" y2="14" />
                            <line x1="23" y1="11" x2="17" y2="11" />
                        </svg>
                        Create User
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Existing Users -->
    <div class="card">
        <div class="card-header">
            <h3 class="card-title">Existing Users</h3>
        </div>
        <div class="card-body">
            <div id="usersList" class="users-list">
                <!-- Loaded dynamically -->
            </div>
        </div>
    </div>
</div>
